<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VectoRise — Try the career before you choose it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#081432;
  --deep:#0F2C63;
  --blue:#1856E0;
  --blue-2:#1E63FF;
  --sky:#4FA3FF;
  --sky-2:#8FCBFF;
  --mist:#F2F6FF;
  --mist-2:#E8F0FE;
  --white:#FFFFFF;
  --ink:#0E1930;
  --slate:#5B6B8C;
  --slate-2:#8494B3;
  --line:#DFE8FA;
  --green:#12966B;
  --green-bg:#E7F7F1;
  --amber:#B5790A;
  --amber-bg:#FCF1DE;
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:24px;
  --shadow-sm: 0 2px 8px rgba(8,20,50,0.06);
  --shadow: 0 12px 32px rgba(8,20,50,0.10);
  --shadow-lg: 0 24px 60px rgba(8,20,50,0.16);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--mist);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--sky-2); color:var(--navy);}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,textarea,select{font-family:inherit; font-size:inherit; color:inherit;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#C7D6F5; border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- utility ---------- */
.eyebrow{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--sky); font-weight:600;
}
.vline{ position:relative; }
.chev{
  display:inline-block; width:9px; height:9px; border-top:2px solid currentColor; border-right:2px solid currentColor;
  transform:rotate(-45deg); margin-left:6px; position:relative; top:-1px;
}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:100px;
  font-weight:600; font-size:14.5px; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:linear-gradient(135deg,var(--blue-2),var(--deep)); color:#fff; box-shadow:0 10px 24px rgba(24,86,224,0.32); }
.btn-primary:hover{ box-shadow:0 14px 30px rgba(24,86,224,0.42); }
.btn-ghost{ background:var(--white); color:var(--deep); border:1.5px solid var(--line); }
.btn-ghost:hover{ border-color:var(--sky); }
.btn-dark{ background:var(--navy); color:#fff; }
.btn-sm{ padding:9px 16px; font-size:13px; border-radius:100px; }
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:100px;
  font-size:12px; font-weight:600; font-family:var(--mono); letter-spacing:.02em;
}
.pill-blue{ background:var(--mist-2); color:var(--blue); }
.pill-green{ background:var(--green-bg); color:var(--green); }
.pill-amber{ background:var(--amber-bg); color:var(--amber); }
.pill-slate{ background:#EEF1F8; color:var(--slate); }
.card{ background:var(--white); border-radius:var(--radius); border:1px solid var(--line); box-shadow:var(--shadow-sm); }
.card:hover{ box-shadow:var(--shadow); }

/* ---------- landing ---------- */
#landing{ min-height:100vh; background:var(--navy); position:relative; overflow:hidden; }
.landing-nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 5vw; position:relative; z-index:5;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ width:34px; height:34px; }
.brand-name{ color:#fff; font-weight:800; font-size:19px; letter-spacing:-.01em; }
.landing-nav-links{ display:flex; align-items:center; gap:34px; }
.landing-nav-links a{ color:rgba(255,255,255,.68); font-size:14px; font-weight:500; }
.landing-nav-links a:hover{ color:#fff; }

.trajectory-bg{ position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.55; }

.hero{
  position:relative; z-index:5; padding:8vh 5vw 10vh; max-width:1180px; margin:0 auto;
}
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:8px; color:var(--sky-2); font-family:var(--mono);
  font-size:12px; letter-spacing:.14em; text-transform:uppercase; padding:7px 14px;
  border:1px solid rgba(143,203,255,.35); border-radius:100px; margin-bottom:28px; font-weight:600;
}
.hero h1{
  color:#fff; font-size:clamp(38px,6vw,74px); line-height:1.04; letter-spacing:-.03em; font-weight:800;
  max-width:920px;
}
.hero h1 em{ font-style:normal; background:linear-gradient(120deg,var(--sky-2),var(--sky)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero p.sub{ color:rgba(255,255,255,.62); font-size:19px; max-width:600px; margin-top:24px; line-height:1.55; font-weight:400; }
.hero-actions{ display:flex; gap:14px; margin-top:38px; align-items:center; flex-wrap:wrap; }
.hero-actions .btn-ghost{ background:rgba(255,255,255,.06); color:#fff; border-color:rgba(255,255,255,.18); }
.hero-actions .btn-ghost:hover{ border-color:var(--sky); }

.gap-strip{
  margin-top:80px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:22px;
  max-width:760px; padding:22px 26px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
  border-radius:var(--radius-lg); backdrop-filter:blur(6px);
}
.gap-node{ text-align:center; }
.gap-node .lbl{ color:#fff; font-weight:700; font-size:15px; }
.gap-node .sub2{ color:rgba(255,255,255,.5); font-size:12.5px; margin-top:3px; }
.gap-arrow{ color:rgba(255,255,255,.28); font-size:20px; }
.gap-node.missing .lbl{ color:var(--sky-2); }
.gap-node.missing{ position:relative; }
.gap-node.missing::before{ content:''; position:absolute; inset:-10px -14px; border:1.5px dashed rgba(143,203,255,.5); border-radius:14px; }

.stat-row{ display:flex; gap:52px; margin-top:70px; flex-wrap:wrap; }
.stat-row .stat b{ color:#fff; font-size:30px; font-weight:800; display:block; letter-spacing:-.02em; }
.stat-row .stat span{ color:rgba(255,255,255,.5); font-size:13px; margin-top:4px; display:block; }

/* mission strip below hero */
.mission-band{ background:var(--white); padding:64px 5vw; }
.mission-inner{ max-width:1180px; margin:0 auto; display:grid; grid-template-columns:1.1fr 1fr; gap:60px; align-items:center; }
.mission-inner h2{ font-size:clamp(26px,3vw,38px); line-height:1.2; letter-spacing:-.02em; color:var(--ink); font-weight:700; }
.mission-inner h2 .accent{ color:var(--blue); }
.mission-list{ display:flex; flex-direction:column; gap:18px; }
.mission-item{ display:flex; gap:14px; align-items:flex-start; }
.mission-item .n{
  font-family:var(--mono); font-size:12px; color:var(--sky); background:var(--mist-2); border-radius:8px;
  width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; margin-top:2px;
}
.mission-item p{ color:var(--slate); font-size:14.5px; line-height:1.55; }
.mission-item strong{ color:var(--ink); display:block; font-size:15px; margin-bottom:2px; }

.who-band{ background:var(--mist); padding:70px 5vw 90px; }
.who-inner{ max-width:1180px; margin:0 auto; }
.who-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:34px; flex-wrap:wrap; gap:16px;}
.who-head h2{ font-size:30px; letter-spacing:-.02em; font-weight:700; }
.who-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
.who-card{ padding:26px 22px; }
.who-card .who-buys{ font-family:var(--mono); font-size:11px; color:var(--sky); letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
.who-card h3{ font-size:19px; margin-top:10px; letter-spacing:-.01em; }
.who-card p{ color:var(--slate); font-size:13.5px; margin-top:10px; line-height:1.5; }

.cta-band{ background:linear-gradient(135deg,var(--navy),var(--deep) 120%); padding:90px 5vw; text-align:center; position:relative; overflow:hidden;}
.cta-band h2{ color:#fff; font-size:clamp(28px,4vw,46px); letter-spacing:-.02em; font-weight:800; max-width:700px; margin:0 auto; }
.cta-band p{ color:rgba(255,255,255,.6); margin-top:16px; font-size:16px; }
.cta-band .btn{ margin-top:32px; }
.foot{ padding:30px 5vw; background:var(--navy); border-top:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; color:rgba(255,255,255,.4); font-size:12.5px; flex-wrap:wrap; gap:10px;}

/* ---------- auth ---------- */
.auth-screen{ min-height:100vh; display:grid; grid-template-columns:1fr 1fr; background:var(--white); }
.auth-visual{ background:var(--navy); position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:44px; }
.auth-visual .brand-name{ }
.auth-quote{ color:#fff; font-size:26px; line-height:1.35; font-weight:600; letter-spacing:-.01em; max-width:420px; position:relative; z-index:3;}
.auth-quote span{ color:var(--sky-2); }
.auth-caption{ color:rgba(255,255,255,.45); font-size:13px; position:relative; z-index:3;}
.auth-form-wrap{ display:flex; align-items:center; justify-content:center; padding:44px; }
.auth-form{ width:100%; max-width:380px; }
.auth-form h1{ font-size:27px; letter-spacing:-.02em; font-weight:800; }
.auth-form p.lead{ color:var(--slate); font-size:14.5px; margin-top:8px; margin-bottom:30px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--slate); margin-bottom:7px; letter-spacing:.01em;}
.field input, .field select{
  width:100%; padding:13px 15px; border-radius:11px; border:1.5px solid var(--line); font-size:14.5px; background:var(--mist);
  transition:border .15s;
}
.field input:focus, .field select:focus{ outline:none; border-color:var(--sky); background:#fff; }
.auth-submit{ width:100%; justify-content:center; margin-top:8px; }
.auth-alt{ text-align:center; color:var(--slate-2); font-size:13px; margin-top:20px; }
.auth-alt button{ color:var(--blue); font-weight:600; }

/* ---------- onboarding ---------- */
.onb-screen{ min-height:100vh; background:var(--mist); display:flex; flex-direction:column; align-items:center; padding:40px 20px 80px; }
.onb-top{ width:100%; max-width:620px; display:flex; align-items:center; gap:14px; margin-bottom:44px; }
.onb-progress{ flex:1; height:5px; background:var(--line); border-radius:10px; overflow:hidden; }
.onb-progress-bar{ height:100%; background:linear-gradient(90deg,var(--blue),var(--sky)); border-radius:10px; transition:width .35s ease; }
.onb-step-lbl{ font-family:var(--mono); font-size:12px; color:var(--slate); white-space:nowrap; }
.onb-card{ width:100%; max-width:620px; background:#fff; border-radius:var(--radius-lg); padding:44px; box-shadow:var(--shadow); border:1px solid var(--line);}
.onb-card .eyebrow{ margin-bottom:10px; display:block;}
.onb-card h2{ font-size:26px; letter-spacing:-.02em; font-weight:700; margin-bottom:8px;}
.onb-card p.hint{ color:var(--slate); font-size:14.5px; margin-bottom:28px; }
.opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.opt-grid.single{ grid-template-columns:1fr; }
.opt{
  border:1.5px solid var(--line); border-radius:13px; padding:16px 18px; display:flex; align-items:center; gap:12px;
  transition:.15s; background:#fff;
}
.opt:hover{ border-color:var(--sky-2); background:var(--mist); }
.opt.sel{ border-color:var(--blue); background:var(--mist-2); }
.opt .ico{ font-size:20px; }
.opt .lbl2{ font-weight:600; font-size:14.5px; }
.opt .sub3{ font-size:12px; color:var(--slate-2); margin-top:2px; }
.onb-nav{ display:flex; justify-content:space-between; margin-top:34px; align-items:center; }
.onb-skip{ color:var(--slate-2); font-size:13px; font-weight:600; }

/* ---------- app shell ---------- */
.app-shell{ min-height:100vh; display:grid; grid-template-columns:248px 1fr; }
.sidebar{ background:var(--navy); padding:26px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.sidebar .brand{ padding:6px 10px 30px; }
.side-nav{ display:flex; flex-direction:column; gap:3px; flex:1; }
.side-link{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:11px; color:rgba(255,255,255,.6);
  font-size:14px; font-weight:500; transition:.15s;
}
.side-link:hover{ background:rgba(255,255,255,.06); color:#fff; }
.side-link.active{ background:rgba(24,86,224,.28); color:#fff; font-weight:600; }
.side-link .ico{ width:18px; height:18px; flex:none; opacity:.9;}
.side-foot{ border-top:1px solid rgba(255,255,255,.1); padding-top:16px; margin-top:10px;}
.side-user{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:11px; }
.side-user:hover{ background:rgba(255,255,255,.06); }
.avatar{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--sky),var(--blue)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; flex:none;}
.side-user-name{ color:#fff; font-size:13.5px; font-weight:600; }
.side-user-role{ color:rgba(255,255,255,.4); font-size:11.5px; }

.main{ padding:34px 44px 80px; max-width:1240px; }
.topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:30px; gap:20px; flex-wrap:wrap;}
.topbar h1{ font-size:27px; letter-spacing:-.02em; font-weight:800; }
.topbar p.desc{ color:var(--slate); font-size:14.5px; margin-top:6px; max-width:560px;}

/* section grids */
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.stat-card{ padding:20px 22px; }
.stat-card .lbl{ color:var(--slate); font-size:12.5px; font-weight:600; }
.stat-card .val{ font-size:28px; font-weight:800; letter-spacing:-.02em; margin-top:6px; }
.stat-card .delta{ font-size:12px; color:var(--green); margin-top:4px; font-weight:600;}

.sim-card{ padding:22px; display:flex; flex-direction:column; gap:12px; cursor:pointer; transition:.18s;}
.sim-card:hover{ transform:translateY(-3px); }
.sim-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.sim-domain-badge{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.sim-card h3{ font-size:17px; letter-spacing:-.01em; margin-top:4px; }
.sim-card p.desc2{ color:var(--slate); font-size:13.5px; line-height:1.5; }
.sim-meta{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
.sim-progress-tag{ margin-top:6px; }

.list-card{ padding:22px 24px; display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap;}
.list-card .li-main{ flex:1; min-width:240px; }
.list-card h3{ font-size:16.5px; letter-spacing:-.01em; }
.list-card p.desc2{ color:var(--slate); font-size:13.5px; margin-top:5px; }
.li-tags{ display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
.li-match{ text-align:right; min-width:110px; }
.li-match .pct{ font-size:22px; font-weight:800; color:var(--blue); font-family:var(--mono); }
.li-match .pctlbl{ font-size:11px; color:var(--slate-2); }

/* modal / simulation runner */
.modal-overlay{ position:fixed; inset:0; background:rgba(8,20,50,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:26px; animation:fadeIn .18s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal{ background:#fff; border-radius:var(--radius-lg); width:100%; max-width:660px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:slideUp .22s ease; }
@keyframes slideUp{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.modal-head{ padding:26px 30px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:#fff; z-index:2; border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
.modal-head-l{ display:flex; align-items:center; gap:14px; }
.modal-close{ width:32px; height:32px; border-radius:50%; background:var(--mist); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--slate); flex:none;}
.modal-close:hover{ background:var(--line); }
.modal-body{ padding:30px; }
.step-track{ display:flex; gap:6px; margin-bottom:22px; }
.step-track div{ flex:1; height:4px; border-radius:4px; background:var(--line); }
.step-track div.done{ background:var(--blue); }
.scenario-box{ background:var(--mist); border-left:3px solid var(--sky); border-radius:0 12px 12px 0; padding:18px 20px; font-size:14.5px; line-height:1.6; color:var(--ink); margin-bottom:22px;}
.choice{ display:block; width:100%; text-align:left; border:1.5px solid var(--line); border-radius:13px; padding:16px 18px; margin-bottom:11px; transition:.15s;}
.choice:hover{ border-color:var(--sky-2); background:var(--mist); }
.choice.picked{ border-color:var(--blue); background:var(--mist-2); }
.choice .clbl{ font-weight:600; font-size:14.5px; }
.choice .csub{ font-size:12.5px; color:var(--slate); margin-top:4px; }
.reflect-ta{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; font-size:14px; min-height:76px; background:var(--mist); resize:vertical;}
.reflect-ta:focus{ outline:none; border-color:var(--sky); background:#fff;}

.badge-earned{ background:linear-gradient(135deg,var(--navy),var(--deep)); border-radius:18px; padding:30px; color:#fff; text-align:center; position:relative; overflow:hidden;}
.badge-earned .ring{ width:64px; height:64px; margin:0 auto 16px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; font-size:28px; border:2px solid rgba(255,255,255,.25);}
.badge-earned h3{ font-size:20px; letter-spacing:-.01em;}
.badge-earned p{ color:rgba(255,255,255,.6); font-size:13px; margin-top:6px;}
.skill-delta-row{ display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
.skill-delta{ background:rgba(255,255,255,.08); border-radius:10px; padding:8px 12px; font-family:var(--mono); font-size:12px;}

/* mentor */
.mentor-wrap{ display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:flex-start;}
.chat-shell{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); display:flex; flex-direction:column; height:600px; overflow:hidden;}
.chat-log{ flex:1; overflow-y:auto; padding:26px; display:flex; flex-direction:column; gap:16px; }
.msg{ max-width:80%; padding:14px 17px; border-radius:16px; font-size:14.5px; line-height:1.55; }
.msg.mentor{ background:var(--mist); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.user{ background:var(--blue); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
.msg.mentor .tag{ font-family:var(--mono); font-size:10.5px; color:var(--sky); letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:6px; font-weight:700;}
.prompt-chips{ display:flex; gap:8px; flex-wrap:wrap; padding:14px 20px 0; }
.prompt-chip{
  display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:100px;
  border:1.5px solid var(--line); background:var(--white); font-size:12.5px; font-weight:600; color:var(--deep);
  transition:.15s;
}
.prompt-chip:hover{ border-color:var(--sky); background:var(--mist); transform:translateY(-1px); }
.prompt-chip .cico{ font-size:13px; }
.prompt-chip:disabled, .prompt-chip.disabled{ opacity:.4; pointer-events:none; }
.chat-input-row{ display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line); }
.chat-input-row input{ flex:1; border:1.5px solid var(--line); border-radius:100px; padding:12px 18px; background:var(--mist); font-size:14px;}
.chat-input-row input:focus{ outline:none; border-color:var(--sky); background:#fff;}
.mentor-side .card{ padding:20px; margin-bottom:16px; }
.mentor-side h4{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--slate); margin-bottom:14px; font-weight:700;}
.axis-row{ margin-bottom:12px; }
.axis-row .axhead{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
.axis-row .axhead b{ font-weight:600; }
.axis-track{ height:6px; background:var(--line); border-radius:6px; overflow:hidden; }
.axis-fill{ height:100%; background:linear-gradient(90deg,var(--sky),var(--blue)); border-radius:6px; transition:width .5s ease;}
.typing{ display:flex; gap:4px; padding:6px 0;}
.typing span{ width:6px; height:6px; border-radius:50%; background:var(--slate-2); animation:blink 1.2s infinite; }
.typing span:nth-child(2){ animation-delay:.2s;} .typing span:nth-child(3){ animation-delay:.4s;}
@keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

/* map */
.map-shell{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:10px; overflow:hidden; }
.map-legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; }
.map-legend .lg{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--slate); }
.map-legend .dot{ width:9px; height:9px; border-radius:50%; }

/* badges grid */
.badge-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.rec-card{ padding:22px; }
.rec-card .rtop{ display:flex; justify-content:space-between; align-items:flex-start; }
.rec-icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.rec-card h4{ font-size:15.5px; margin-top:14px; letter-spacing:-.01em; }
.rec-card p{ font-size:12.5px; color:var(--slate); margin-top:6px; }
.rec-verify{ margin-top:12px; display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--green); font-weight:600; }

.empty-state{ text-align:center; padding:70px 30px; }
.empty-state .em-ico{ font-size:40px; margin-bottom:16px; }
.empty-state h3{ font-size:19px; margin-bottom:8px; }
.empty-state p{ color:var(--slate); font-size:14px; max-width:380px; margin:0 auto 22px; }

.partner-note{ background:var(--amber-bg); border:1px solid #F2DFAF; color:#8A5C08; padding:14px 18px; border-radius:12px; font-size:13px; margin-bottom:22px; display:flex; gap:10px; align-items:flex-start; }
.partner-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.partner-card{ padding:24px; text-align:center; position:relative; }
.partner-logo{ width:56px; height:56px; border-radius:14px; background:var(--mist-2); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-weight:800; color:var(--blue); font-size:18px; }
.partner-card h4{ font-size:15px; }
.partner-card .status{ margin-top:10px; }
.partner-card .vac{ margin-top:14px; text-align:left; background:var(--mist); border-radius:10px; padding:12px 14px; }
.partner-card .vac .vt{ font-size:12.5px; font-weight:600; }
.partner-card .vac .vs{ font-size:11px; color:var(--slate-2); margin-top:2px; }
.blurish{ filter:blur(2.5px); opacity:.6; user-select:none; }

@media (max-width: 980px){
  .app-shell{ grid-template-columns:1fr; }
  .sidebar{ display:none; }
  .grid-3, .partner-grid, .badge-grid{ grid-template-columns:1fr 1fr; }
  .grid-2{ grid-template-columns:1fr; }
  .mentor-wrap{ grid-template-columns:1fr; }
  .auth-screen{ grid-template-columns:1fr; }
  .auth-visual{ display:none; }
  .who-grid{ grid-template-columns:1fr 1fr; }
  .mission-inner{ grid-template-columns:1fr; }
}
@media (max-width: 620px){
  .grid-3, .partner-grid, .badge-grid, .who-grid, .opt-grid{ grid-template-columns:1fr; }
  .main{ padding:24px 18px 60px; }
}
</style>

function trajectoryBg(){
  let paths='';
  for(let i=0;i<7;i++){
    const y = 40 + i*90;
    const amp = 20 + (i%3)*10;
    paths += `<path d="M -50 ${y} Q 300 ${y-amp} 650 ${y} T 1400 ${y-amp}" stroke="url(#tgrad)" stroke-width="1.2" fill="none" opacity="${0.5 - i*0.05}"/>`;
  }
  let dots='';
  for(let i=0;i<18;i++){
    const cx = (i*137)%1400; const cy = (i*97)%700;
    dots += `<circle cx="${cx}" cy="${cy}" r="${1+ (i%3)}" fill="#4FA3FF" opacity="${0.15 + (i%4)*0.07}"/>`;
  }
  return `<svg width="100%" height="100%" viewBox="0 0 1400 760" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="tgrad" x1="0" x2="1"><stop offset="0" stop-color="#4FA3FF"/><stop offset="1" stop-color="#1856E0"/></linearGradient></defs>
    ${paths}${dots}
  </svg>`;
}

  return `<img src="${LOGO_MARK_SRC}" alt="VectoRise" style="width:${size}px; height:${size}px; object-fit:contain; display:block; flex:none;"/>`;
}

function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }

function localAnalyze(){
  const entries = Object.entries(state.skillProfile).sort((a,b)=>b[1]-a[1]);
  const top = entries[0];
  const low = entries[entries.length-1];
  if(!top || top[1]<=0){
    return `You've made a few decisions so far — not quite enough for a confident read yet. Try one more simulation in a different domain so I can compare how your choices shift across contexts.`;
  }
  const riskNote = state.skillProfile.risk > 1 ? "You lean toward decisive, higher-risk calls under pressure — useful in fast-moving environments, worth pairing with a second opinion on irreversible decisions." :
                    state.skillProfile.risk < -1 ? "You consistently choose the safer, more conservative path — strong in regulated or safety-critical settings, but watch for over-caution when speed matters." :
                    "You balance risk fairly evenly — you're not reflexively cautious or reflexively bold, which usually reads as good judgement under ambiguity.";
  const consistencyNote = state.skillProfile.consistency > 1 ? " Your choices are unusually consistent across different scenarios — a strong signal for roles that need reliability under repeated pressure." : "";
  return `Based on ${state.completedSims.length} simulation${state.completedSims.length===1?'':'s'}, your strongest signal is **${SKILL_LABELS[top[0]]}**. ${riskNote}${consistencyNote} Your least emphasised trait so far is ${SKILL_LABELS[low[0]]} — that's not a weakness, just an area you haven't been tested on yet. Try a simulation in a domain you haven't touched to fill in the picture.`;
}

async function sendChat(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  await pushUserMessage(text);
}

async function sendPreset(i){
  if(state.chatBusy) return;
  const p = MENTOR_PROMPTS[i];
  await pushUserMessage(p.q);
}

async function pushUserMessage(text){
  state.chat.push({role:'user', text});
  const input = document.getElementById('chat-input');
  if(input) input.value='';
  state.chatBusy = true;
  render();

  const reply = await getMentorReply(text);
  state.chatBusy = false;
  state.chat.push({role:'mentor', text: reply});
  render();
}

async function getMentorReply(question){
  const context = buildMentorContext();
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 400,
        messages: [
          { role: "user", content:
            `You are the in-app "AI Mentor" for a career-exploration product called VectoRise, used by teenagers (14-19) in Kazakhstan/Central Asia. `+
            `You analyse how the student makes decisions in short work simulations (not what they say they like), and give warm, concrete, non-generic career guidance. `+
            `Keep replies under 120 words, plain conversational English, no headers or markdown, no over-promising a specific career. `+
            `Here is the student's data:\\n${context}\\n\\nStudent's question: "${question}"\\n\\nReply as the mentor:` }
        ],
      })
    });
    if(!response.ok) throw new Error('api error');
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    if(textBlock && textBlock.text) return textBlock.text.trim();
    throw new Error('no text');
  }catch(e){
    return fallbackMentorReply(question);
  }
}

function buildMentorContext(){
  const domainList = state.completedSims.map(c=>{
    const sim = SIMULATIONS.find(s=>s.id===c.simId);
    return sim ? `${sim.title} (${DOMAINS[sim.domain].label})` : c.simId;
  }).join(', ') || 'none yet';
  const skills = SKILL_AXES.map(a=>`${SKILL_LABELS[a]}: ${state.skillProfile[a]}`).join(', ');
  return `Onboarding: grade=${state.onboard.grade}, interests=${state.onboard.domains.join('/')}, decision style=${state.onboard.style}, goal=${state.onboard.goal}. Completed simulations: ${domainList}. Skill profile (relative scores): ${skills}.`;
}

function fallbackMentorReply(question){
  const q = question.toLowerCase();
  if(state.completedSims.length===0) return `I don't have decisions to analyse yet — try a simulation first, then ask me again. I promise the answer will be a lot more specific.`;

  const top = topSkills(1)[0];
  const skillVerb = t => t==='risk'?'fast, high-stakes judgement':t==='consistency'?'reliability under repeated pressure':t==='analysis'?'careful, data-driven reasoning':t==='leadership'?'taking ownership when things get messy':t==='collaboration'?'working closely with others under pressure':'original problem-solving';

  if(q.includes('internship') || q.includes('fit') && q.includes('best')){
    const domainsTried = [...new Set(state.completedSims.map(c=>SIMULATIONS.find(s=>s.id===c.simId)?.domain))];
    const bestIntern = INTERNSHIPS.slice().sort((a,b)=>matchScore(b.domain)-matchScore(a.domain))[0];
    return `Based on your simulations, "${bestIntern.title}" at ${bestIntern.org} looks like your strongest fit right now — it sits in ${DOMAINS[bestIntern.domain].label}, a domain where your decisions have leaned toward ${skillVerb(top)}. Check the Internships tab for the exact match score.`;
  }
  if(q.includes('next') || q.includes('should i try')){
    const nextSim = SIMULATIONS.find(s=>!state.completedSims.some(c=>c.simId===s.id));
    if(!nextSim) return `You've completed every simulation available right now — nice work. I'd revisit the one where your reflection said "maybe" and see if a second attempt changes your answer.`;
    return `Try "${nextSim.title}" next — it's in ${DOMAINS[nextSim.domain].label}, a domain your profile hasn't been tested in yet. That will sharpen my read on you a lot faster than repeating a domain you've already tried.`;
  }
  if(q.includes('closest') || (q.includes('career') || q.includes('profession')) && !q.includes('internship')){
    return `Right now your strongest signal is ${top?SKILL_LABELS[top]:'still forming'}. That shows up in roles that reward ${skillVerb(top)}. Try a simulation in a domain you haven't touched yet so I can sharpen this into specific professions rather than a general direction.`;
  }
  if(q.includes('recent') || q.includes('last simulation') || q.includes('closer look')){
    const last = state.completedSims[state.completedSims.length-1];
    const sim = SIMULATIONS.find(s=>s.id===last.simId);
    const dom = Object.entries(last.skills).sort((a,b)=>b[1]-a[1])[0];
    return `In "${sim.title}" your choices leaned most toward ${dom?SKILL_LABELS[dom[0]]:'a mixed pattern'}. That's a useful data point for ${DOMAINS[sim.domain].label} specifically — one simulation is a snapshot, not a verdict, so I'd weigh it alongside your other results.`;
  }
  if(q.includes('missing') || q.includes('gap') || q.includes('untested') || q.includes('weak') || q.includes('improve')){
    const low = Object.entries(state.skillProfile).sort((a,b)=>a[1]-b[1])[0];
    return `I don't think in terms of weaknesses — only untested areas. ${SKILL_LABELS[low[0]]} is the dimension your simulations have stressed the least so far. That's not a flaw, it just means we need more data — a simulation that puts you under a different kind of pressure would fill it in.`;
  }
  return localAnalyze() + ` If you want, try one of the quick questions above, or ask me something specific.`;
}

function drawMap(){
  const wrap = document.getElementById('map-svg-wrap');
  if(!wrap) return;
  const W=1000, H=600, cx=W/2, cy=H/2 - 10;
  const completed = state.completedSims.map(c=>SIMULATIONS.find(s=>s.id===c.simId)).filter(Boolean);

  if(completed.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="em-ico">🧭</div><h3>Your map starts with your first decision</h3><p>Complete a simulation and this space will fill with your trajectory — domains explored, emerging skills, opportunities and professions worth exploring.</p><button class="btn btn-primary btn-sm" onclick="setState({appTab:'sims'})">Go to simulations</button></div>`;
    return;
  }

  const domainNodes = [...new Set(completed.map(s=>s.domain))];
  const skillNodes = topSkills(3);
  const opportunities = buildOpportunityNodes(domainNodes);
  const exploreNodes = buildExploreNodes(domainNodes);

  const ring1R = 145, ring2R = 250, ring3R = 250;
  let nodes = [{id:'center', x:cx, y:cy, r:34, label: firstName(), type:'center'}];
  let links = [];

  // domain angle lookup, spread explored domains across the full circle
  const domainAngle = {};
  domainNodes.forEach((dk,i)=>{ domainAngle[dk] = (i/domainNodes.length) * Math.PI*2 - Math.PI/2; });

  domainNodes.forEach(dk=>{
    const angle = domainAngle[dk];
    const x = cx + Math.cos(angle)*ring1R, y = cy + Math.sin(angle)*ring1R;
    nodes.push({id:'dom-'+dk, x, y, r:26, label:DOMAINS[dk].icon+' '+DOMAINS[dk].label, color:DOMAINS[dk].color, bg:DOMAINS[dk].bg, type:'domain'});
    links.push({from:'center', to:'dom-'+dk, color:DOMAINS[dk].color});
  });

  skillNodes.forEach((sk,i)=>{
    const parentDomain = domainNodes[i % domainNodes.length];
    const baseAngle = domainAngle[parentDomain];
    const angle = baseAngle - 0.34 + (i%2)*0.68;
    const x = cx + Math.cos(angle)*ring1R*0.78, y = cy + Math.sin(angle)*ring1R*0.78 - 6;
    nodes.push({id:'skill-'+sk, x, y, r:17, label:SKILL_LABELS[sk], color:'#12966B', bg:'#E7F7F1', type:'skill'});
    links.push({from:'dom-'+parentDomain, to:'skill-'+sk, color:'#B9D9CF', dash:true});
  });

  // group opportunities by their parent domain so siblings fan out around that domain's angle
  const byDomain = {};
  opportunities.forEach(o=>{ (byDomain[o.domain] = byDomain[o.domain]||[]).push(o); });
  Object.entries(byDomain).forEach(([dk, items])=>{
    const baseAngle = domainAngle[dk] !== undefined ? domainAngle[dk] : 0;
    const spread = 0.5;
    items.forEach((o,i)=>{
      const offset = items.length>1 ? (i/(items.length-1) - 0.5)*spread*2 : 0;
      const angle = baseAngle + offset;
      const x = cx + Math.cos(angle)*ring2R, y = cy + Math.sin(angle)*ring2R;
      const style = MAP_NODE_STYLE[o.type];
      const id = `${o.type}-${dk}-${i}`;
      nodes.push({id, x, y, r:21, label: style.icon+' '+o.label, color:style.color, bg:style.bg, type:o.type});
      links.push({from:'dom-'+dk, to:id, color:style.bg, dash:true});
    });
  });

  // domains not yet explored — connect straight to center, muted + dashed
  exploreNodes.forEach((e,i)=>{
    const angle = (Object.keys(domainAngle).length + i) / (domainNodes.length + exploreNodes.length) * Math.PI*2 - Math.PI/2 + 0.35;
    const x = cx + Math.cos(angle)*ring3R*1.18, y = cy + Math.sin(angle)*ring3R*1.18;
    const style = MAP_NODE_STYLE.explore;
    nodes.push({id:'explore-'+e.domain, x, y, r:24, label: DOMAINS[e.domain].icon+' Explore: '+e.label, color:style.color, bg:style.bg, type:'explore'});
    links.push({from:'center', to:'explore-'+e.domain, color:'#C7D0E6', dash:true});
  });

  const nodeMap = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const linkSvg = links.map(l=>{
    const a = nodeMap[l.from], b = nodeMap[l.to];
    if(!a||!b) return '';
    const mx = (a.x+b.x)/2, my=(a.y+b.y)/2 - 20;
    return `<path d="M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}" stroke="${l.color||'#DFE8FA'}" stroke-width="1.6" fill="none" ${l.dash?'stroke-dasharray="4 4"':''} opacity=".8"/>`;
  }).join('');

  const nodeSvg = nodes.map(n=>{
    if(n.type==='center'){
      return `<g><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="#0F2C63"/><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="none" stroke="#4FA3FF" stroke-width="2" opacity=".5"/>
        <text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter">${n.label}</text></g>`;
    }
    const dashed = n.type==='explore' ? 'stroke-dasharray="3 3"' : '';
    const lines = wrapLabel(n.label, 16);
    return `<g style="cursor:default;">
      <circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${n.bg}" stroke="${n.color}" stroke-width="1.5" ${dashed}/>
      ${lines.map((ln,i)=>`<text x="${n.x}" y="${n.y + n.r + 16 + i*13}" text-anchor="middle" fill="#0E1930" font-size="11" font-family="Inter" font-weight="600">${ln}</text>`).join('')}
    </g>`;
  }).join('');

  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">${linkSvg}${nodeSvg}</svg>`;
}

function wrapLabel(label, maxLen){
  const words = label.split(' ');
  let lines=[], cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length>maxLen){ lines.push(cur.trim()); cur=w; } else { cur = (cur+' '+w).trim(); }
  });
  if(cur) lines.push(cur);
  return lines.slice(0,2);
}

/* Study / internship / company / adjacent-profession nodes for domains already explored */
function buildOpportunityNodes(domainKeys){
  const study=[], intern=[], company=[], profession=[];
  domainKeys.forEach(dk=>{
    const s = STUDY.find(x=>x.domain===dk); if(s && study.length<2) study.push({label:s.title, domain:dk, type:'study'});
    const i = INTERNSHIPS.find(x=>x.domain===dk); if(i && intern.length<2) intern.push({label:i.title, domain:dk, type:'intern'});
    const c = PARTNERS.find(x=>x.domain===dk); if(c && company.length<2) company.push({label:c.name, domain:dk, type:'company'});
    const profs = PROFESSIONS_BY_DOMAIN[dk] || [];
    const simRole = SIMULATIONS.find(sm=>sm.domain===dk)?.role;
    const prof = profs.find(p=>p!==simRole) || profs[0];
    if(prof && profession.length<2) profession.push({label:prof, domain:dk, type:'profession'});
  });
  return [...study, ...intern, ...company, ...profession];
}

/* Domains the student hasn't tried yet, prioritising their stated onboarding interests */
function buildExploreNodes(domainKeys){
  const untried = Object.keys(DOMAINS).filter(dk=>!domainKeys.includes(dk));
  untried.sort((a,b)=> (state.onboard.domains.includes(b)?1:0) - (state.onboard.domains.includes(a)?1:0));
  return untried.slice(0,2).map(dk=>({label: DOMAINS[dk].label, domain:dk, type:'explore'}));
}

    return `
      <div class="topbar"><div><h1>Skills & Badges</h1><p class="desc">Verified Experience Records — earned, not self-declared.</p></div></div>
      <div class="empty-state card">
        <div class="em-ico">🏅</div>
        <h3>No records yet</h3>
        <p>Complete your first simulation to earn a Verified Experience Record tied to real decisions you made.</p>
        <button class="btn btn-primary" onclick="setState({appTab:'sims'})">Browse simulations</button>
      </div>`;
  }
  return `
    <div class="topbar"><div><h1>Skills & Badges</h1><p class="desc">Each record reflects decisions made inside a specific scenario — reviewed for realism, not self-declared.</p></div></div>
    <div class="badge-grid">
      ${state.completedSims.map(c=>{
        const sim = SIMULATIONS.find(s=>s.id===c.simId);
        const d = DOMAINS[sim.domain];
        return `
        <div class="card rec-card">
          <div class="rtop"><div class="rec-icon" style="background:${d.bg}; color:${d.color};">${d.icon}</div><span class="pill pill-slate">${sim.duration}</span></div>
          <h4>${sim.title}</h4>
          <p>${sim.role} · ${d.label}</p>
          <div class="rec-verify">● Scenario-reviewed record</div>
        </div>`;
      }).join('')}

}

/* ---- PARTNERS ---- */
function tabPartners(){
  return `
    <div class="topbar"><div><h1>Company Partnerships</h1><p class="desc">Employer-validated simulations and open vacancies are how Verified Experience Records earn real trust.</p></div></div>
    <div class="partner-note">🚧 <div><strong>This section is under active development.</strong> Logos, vacancy details and validation partnerships below are illustrative placeholders while agreements are finalised — nothing here represents a confirmed listing yet.</div></div>
    <div class="partner-grid">
      ${PARTNERS.map(p=>{
        const d = DOMAINS[p.domain];
        return `
        <div class="card partner-card">
          <div class="partner-logo">${p.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
          <h4>${p.name}</h4>
          <div class="status"><span class="pill pill-amber">${p.status}</span></div>
          <div class="vac blurish">
            <div class="vt">Open vacancy — details coming soon</div>
            <div class="vs">${d.label}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function matchScore(domain){
  const has = state.onboard.domains.includes(domain) ? 12 : 0;
  const done = state.completedSims.some(c=>SIMULATIONS.find(s=>s.id===c.simId)?.domain===domain) ? 28 : 0;
  const base = 45;
  return Math.min(97, base + has + done + Math.floor(Math.random()*6));
}

/* ================= SIMULATION RUNNER ================= */
function openRunner(simId){
  const sim = SIMULATIONS.find(s=>s.id===simId);
  state.runner = { sim, stepIndex:0, picks:[], phase:'intro', reflection:{surprise:'', again:''} };
  render();
}
function closeRunner(){ state.runner = null; render(); }

function renderRunnerModal(){
  const r = state.runner;
  const sim = r.sim;
  const d = DOMAINS[sim.domain];

  let inner='';
  if(r.phase==='intro'){
    inner = `
      <div class="scenario-box">${sim.intro}</div>
      <p style="color:var(--slate); font-size:13.5px; margin-bottom:22px;">You'll face ${sim.steps.length} realistic decisions. There's no single correct path — how you decide is what gets recorded.</p>
      <button class="btn btn-primary" onclick="runnerNext()">Begin simulation <span class="chev"></span></button>
    `;
  } else if(r.phase==='steps'){
    const step = sim.steps[r.stepIndex];
    const picked = r.picks[r.stepIndex];
    inner = `
      <div class="step-track">${sim.steps.map((_,i)=>`<div class="${i<=r.stepIndex && (i<r.stepIndex || picked!==undefined) ?'done':''}"></div>`).join('')}</div>
      <div class="scenario-box">${step.prompt}</div>
      ${step.options.map((opt,oi)=>`
        <button class="choice ${picked===oi?'picked':''}" onclick="pickChoice(${oi})">
          <div class="clbl">${opt.label}</div><div class="csub">${opt.sub}</div>
        </button>`).join('')}
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="btn btn-primary btn-sm" ${picked===undefined?'style="opacity:.4; pointer-events:none;"':''} onclick="runnerNext()">${r.stepIndex===sim.steps.length-1?'Continue to reflection':'Next decision'} <span class="chev"></span></button>
      </div>
    `;
  } else if(r.phase==='reflect'){
    inner = `
      <p class="hint" style="margin-bottom:18px; color:var(--slate); font-size:14px;">Quick reflection — this is optional, but it's some of the most valuable data for your AI Mentor.</p>
      <div class="field"><label>What surprised you about this scenario?</label><textarea class="reflect-ta" id="ref-surprise" placeholder="Type a few words..."></textarea></div>
      <div class="field"><label>Would you want to try a real version of this role?</label>
        <div class="opt-grid single" style="margin-top:6px;">
          <div class="opt ${r.reflection.again==='yes'?'sel':''}" onclick="setReflection('again','yes')"><div class="lbl2">Yes, I'd like to explore more</div></div>
          <div class="opt ${r.reflection.again==='maybe'?'sel':''}" onclick="setReflection('again','maybe')"><div class="lbl2">Maybe, I'm not sure yet</div></div>
          <div class="opt ${r.reflection.again==='no'?'sel':''}" onclick="setReflection('again','no')"><div class="lbl2">No, this wasn't for me — and that's useful too</div></div>
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="finishRunner()">See my results <span class="chev"></span></button>
    `;
  } else if(r.phase==='done'){
    const deltas = sumPickSkills(r);
    inner = `
      <div class="badge-earned">
        <div class="ring">${d.icon}</div>
        <h3>Verified Experience Record earned</h3>
        <p>${sim.title} · ${sim.role}</p>
        <div class="skill-delta-row">
          ${Object.entries(deltas).filter(([,v])=>v!==0).map(([k,v])=>`<div class="skill-delta">${SKILL_LABELS[k]} ${v>0?'+':''}${v}</div>`).join('')}
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:22px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="closeRunner(); setState({appTab:'map'});">View on my Career Map</button>
        <button class="btn btn-ghost btn-sm" onclick="closeRunner(); setState({appTab:'mentor'});">Ask my AI Mentor</button>
        <button class="btn btn-primary btn-sm" onclick="closeRunner();">Done</button>
      </div>
    `;
  }

  return `
  <div class="modal-overlay" onclick="if(event.target===this && '${r.phase}'==='done') closeRunner();">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-head-l">
          <div class="sim-domain-badge" style="background:${d.bg}; color:${d.color};">${d.icon}</div>
          <div><div style="font-weight:700; font-size:15.5px;">${sim.title}</div><div style="font-size:12px; color:var(--slate);">${sim.role}</div></div>
        </div>
        <div class="modal-close" onclick="closeRunner()">✕</div>
      </div>
      <div class="modal-body">${inner}</div>
    </div>
  </div>`;
}

function pickChoice(oi){
  state.runner.picks[state.runner.stepIndex] = oi;
  render();
}
function setReflection(field,val){ state.runner.reflection[field]=val; render(); }

function runnerNext(){
  const r = state.runner;
  if(r.phase==='intro'){ r.phase='steps'; render(); return; }
  if(r.phase==='steps'){
    if(r.stepIndex < r.sim.steps.length-1){ r.stepIndex++; }
    else { r.phase='reflect'; }
    render();
  }
}

function sumPickSkills(r){
  const out = Object.fromEntries(SKILL_AXES.map(a=>[a,0]));
  r.picks.forEach((oi,i)=>{
    const opt = r.sim.steps[i].options[oi];
    if(!opt) return;
    Object.entries(opt.skills||{}).forEach(([k,v])=>{ out[k]=(out[k]||0)+v; });
  });
  return out;
}

function finishRunner(){
  const r = state.runner;
  const surpriseEl = document.getElementById('ref-surprise');
  r.reflection.surprise = surpriseEl ? surpriseEl.value : '';
  const deltas = sumPickSkills(r);
  Object.entries(deltas).forEach(([k,v])=>{ state.skillProfile[k] = (state.skillProfile[k]||0) + v; });
  state.completedSims.push({ simId:r.sim.id, skills:deltas, reflection:r.reflection });
  r.phase='done';
  render();
}

/* ================= boot ================= */
render();
</script>
